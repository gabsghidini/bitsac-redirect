<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formulário Recebido | BitSAC</title>
<meta name="description" content="Página de confirmação da BitSAC com redirecionamento direto para o WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
  /* ---------------------------------------------------------
     BitSAC: página de obrigado minimalista (padrão Korvena).
     Paleta derivada da marca:
     fundo #0A0F18, card navy #121B29, turquesa #00D2B4.
  --------------------------------------------------------- */

  :root{
    --bg:            #090E17;   /* fundo da página ultra escuro */
    --surface:       #111927;   /* navy profundo da marca, cartão principal */
    --surface-2:     #172336;   /* navy médio para badge e divisores */
    --line:          #22324B;   /* bordas sutis sobre o navy */
    --accent:        #00D2B4;   /* turquesa oficial BitSAC */
    --accent-strong: #00F0D0;   /* turquesa claro para hover */
    --accent-ink:    #070D15;   /* texto escuro sobre o botão turquesa */
    --text:          #F8FAFC;   /* branco nítido */
    --text-muted:    #94A3B8;   /* cinza-azulado para texto secundário */
    --whatsapp:      #25D366;   /* verde do whatsapp */

    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-inline: 20px;
    padding-block: 48px;
    position: relative;
    overflow-x: hidden;
  }

  img{ max-width: 100%; }
  [hidden]{ display: none !important; }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .mark-stroke{ animation: draw 1.1s cubic-bezier(.2,.7,.2,1) .1s both; }
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes draw{
    from{ stroke-dashoffset: 140; }
    to{ stroke-dashoffset: 0; }
  }

  /* Marca d'água geométrica da BitSAC no fundo */
  .brand-watermark{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .35;
  }
  .brand-watermark svg{
    position: absolute;
    top: 50%;
    right: -10vmax;
    transform: translateY(-50%);
    width: min(80vmax, 1100px);
    height: auto;
  }

  .wrap{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 30rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 28px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg.logo-icon{
    height: 32px;
    width: auto;
    flex-shrink: 0;
  }
  .brand-text{
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "Unbounded", ui-sans-serif, sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
  }
  .brand-text .teal{ color: var(--accent); }
  .brand-text .sac{ color: #FFFFFF; }
  
  .partner-tag{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.65rem;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: 2px;
  }

  .card{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 44px 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
    box-shadow: 0 30px 70px -35px rgba(0,0,0,.75);
  }

  .badge{
    width: 56px;
    height: 56px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge svg{ width: 26px; height: 26px; }

  h1{
    margin: 0;
    font-family: "Unbounded", ui-sans-serif, sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 2.75rem);
    line-height: 1.14;
    letter-spacing: -.01em;
    text-wrap: balance;
    color: var(--text);
  }

  .cta{
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 22px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: .03em;
    text-decoration: none;
    border: 1px solid transparent;
    transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 10px 25px -8px rgba(0, 210, 180, 0.4);
  }
  .cta:hover{
    background: var(--accent-strong);
    box-shadow: 0 14px 30px -8px rgba(0, 210, 180, 0.6);
  }
  .cta:active{ transform: scale(.98); }
  .cta:focus-visible{
    outline: 2px solid var(--accent-strong);
    outline-offset: 3px;
  }
  .cta svg{ width: 22px; height: 22px; flex-shrink: 0; }

  .meta{
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .74rem;
    color: var(--text-muted);
  }
  .meta .dot{
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--whatsapp);
    flex-shrink: 0;
    box-shadow: 0 0 8px var(--whatsapp);
  }

  footer{
    position: relative;
    z-index: 1;
    margin-top: 34px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .04em;
    color: var(--text-muted);
    text-align: center;
  }

  @media (max-width: 380px){
    .card{ padding: 36px 22px 28px; border-radius: 18px; }
  }
</style>
</head>
<body>

<!-- Marca d'água geométrica no canto (estilo Korvena) -->
<div class="brand-watermark" aria-hidden="true">
  <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path class="mark-stroke" d="M40 30 H180 C196 30 210 44 210 60 V150 C210 166 196 180 180 180 H90 L40 220 V180 H40 C24 180 10 166 10 150 V60 C10 44 24 30 40 30 Z" stroke="#00D2B4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="0"/>
    <circle cx="70" cy="105" r="10" fill="#00D2B4" opacity="0.3"/>
    <circle cx="110" cy="105" r="10" fill="#00D2B4" opacity="0.3"/>
    <circle cx="150" cy="105" r="10" fill="#00D2B4" opacity="0.3"/>
  </svg>
</div>

<div class="wrap">
  <!-- Brand Header -->
  <div class="brand">
    <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#121B29"/>
      <path d="M7 8H23C24.6569 8 26 9.34315 26 11V20C26 21.6569 24.6569 23 23 23H14L8 27V23H7C5.34315 23 4 21.6569 4 20V11C4 9.34315 5.34315 8 7 8Z" stroke="#00D2B4" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="10" cy="15.5" r="1.5" fill="#00D2B4"/>
      <circle cx="15" cy="15.5" r="1.5" fill="#00D2B4"/>
      <circle cx="20" cy="15.5" r="1.5" fill="#00D2B4"/>
    </svg>
    <div class="brand-text">
      <span class="teal">Bit</span><span class="sac">SAC</span>
    </div>
    <div class="partner-tag">
      <span>Meta Partner</span>
    </div>
  </div>

  <!-- Single Focused Card -->
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="#00D2B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Formulário recebido.</h1>

    <!-- Direct High-Impact CTA Button -->
    <a
      id="btnWhatsapp"
      class="cta"
      href="https://wa.me/554491367439?text=Preenchi%20o%20formul%C3%A1rio%20de%20voc%C3%AAs%20e%20gostaria%20do%20diagn%C3%B3stico%20de%20atendimento%21"
      target="_blank"
      rel="noopener"
    >
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.45 1.32 4.95L2 22l5.24-1.37a9.9 9.9 0 0 0 4.8 1.22h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2Zm0 18.2a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.11.82.83-3.03-.2-.31a8.23 8.23 0 1 1 6.97 3.85Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.8-.23-.09-.39-.12-.56.12-.17.25-.64.8-.78.96-.14.17-.29.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.23.25-.86.84-.86 2.05 0 1.21.88 2.38 1 2.54.12.17 1.74 2.66 4.22 3.73.59.25 1.05.4 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28Z"/>
      </svg>
      Quero ser atendido agora!
    </a>

    <p class="meta"><span class="dot" aria-hidden="true"></span> Diagnóstico gratuito · resposta pelo WhatsApp</p>
  </div>
</div>

<footer>© BITSAC · DIAGNÓSTICO DE ATENDIMENTO</footer>

<script>
  // Configurações
  const PHONE_NUMBER = "554491367439"; // Altere para 5544991367439 se necessário
  const MESSAGE = "Preenchi o formulário de vocês e gostaria do diagnóstico de atendimento!";

  const whatsappUrl = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(MESSAGE)}`;
  const btn = document.getElementById('btnWhatsapp');

  btn.href = whatsappUrl;

  // Track no clique (Lead e Contact)
  btn.addEventListener('click', () => {
    if (typeof fbq === 'function') {
      fbq('track', 'Lead');
      fbq('track', 'Contact');
    }
  });
</script>

</body>
</html>
